<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spotlite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--g:#1DB954;--bg:#0b0b0b;--card:#181818;--line:#2a2a2a;--tx:#fff;--mu:#8a8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:460px;background:#111;border:1px solid var(--line);border-radius:28px;padding:20px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.12em;font-size:20px;display:flex;align-items:center;gap:8px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--g);box-shadow:0 0 14px #1db95488}
.pill,button.b{font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:10px;padding:7px 10px;border:1px solid var(--line);background:#222;color:var(--tx);cursor:pointer}
.pill{border-radius:20px;color:var(--g);border-color:#2f5a3a;background:#14261a;cursor:default}
button.green{color:var(--g);border-color:#2f5a3a;background:#14261a}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center}
.lbl{color:var(--mu);font-weight:700;letter-spacing:.1em;font-size:12px}
.np{display:flex;gap:16px;margin:16px 0}
.art{width:92px;height:92px;border-radius:16px;flex:none;position:relative;display:grid;place-items:center}
.vinyl{width:70%;height:70%;border-radius:50%;background:#1a1226;border:3px solid #ffffff22;display:grid;place-items:center}
.vinyl i{width:22%;height:22%;border-radius:50%;background:var(--g)}
.playing .vinyl{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
h2{margin:0;font-size:20px}.ar{color:#b3b3b3;margin-top:4px}
.tag{display:inline-block;margin-top:10px;font-size:11px;color:var(--mu);background:#262626;padding:5px 8px;border-radius:6px;letter-spacing:.1em}
canvas{width:100%;height:70px;background:#111;border:1px solid var(--line);border-radius:12px;display:block}
.bar{flex:1;height:8px;border-radius:4px;background:#2a2a2a;position:relative;cursor:pointer}
.bar>div{height:100%;border-radius:4px;background:#fff;width:0}
input[type=range]{flex:1;accent-color:#fff}
.ctl{display:flex;justify-content:center;align-items:center;gap:40px;margin:18px 0}
.ctl button{background:none;border:0;color:#bbb;font-size:22px;cursor:pointer}
.play{width:62px;height:62px;border-radius:50%;background:var(--g)!important;color:#000!important;font-size:24px!important;box-shadow:0 0 18px #1db95466}
.sp{font-size:22px;background:none;border:0;cursor:pointer;color:#ddd}.sp.m{color:#ff4d4d}
.trk{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#181818;margin-top:8px;cursor:pointer;border:1px solid transparent}
.trk.on{background:#1DB954;color:#000}.trk.on .a,.trk.on .n,.trk.on .d{color:#0a2a14}
.trk .n{color:var(--mu);width:14px}.trk .i{flex:1}.trk .t{font-weight:700}.trk .a{color:var(--mu);font-size:13px}.trk .d{color:var(--mu);font-size:13px}
.hb{background:none;border:0;font-size:22px;cursor:pointer;color:#555}.hb.l{color:var(--g)}.trk.on .hb.l{color:#000}
.trk.lock{opacity:.7}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:#ff4d4d;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;transition:.3s;max-width:90%}
#toast.s{transform:translateX(-50%) translateY(0)}
.panel{display:none;font-size:12px;color:#ccc;line-height:1.6}.panel.o{display:block}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.ed input{font:inherit;font-size:12px;background:#111;border:1px solid var(--line);color:#fff;border-radius:6px;padding:6px;min-width:0}
/* visualizer modes */
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.modes button{font:700 12px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;border-radius:12px;border:1px solid #333;background:#1c1f1c;color:#8a8a8a;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.modes button:hover{color:#ccc}
.modes button.on{color:#9be37a;border-color:#4f8a3e;background:#1c2b19;box-shadow:0 0 14px #1db95433}
/* customize sheet */
#cm{display:none;position:fixed;inset:0;z-index:90;background:#0d100df2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#cm.o{display:block;animation:cmi .3s ease}@keyframes cmi{from{opacity:0;transform:translateY(24px)}}
.cmi{max-width:480px;margin:0 auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(32px,env(safe-area-inset-bottom,0px));font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.cmh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cmh h3{margin:0;font-size:26px}
#cmx{flex:none;width:52px;height:52px;border-radius:14px;border:1px solid #333;background:#222;color:#ddd;font-size:22px;cursor:pointer}
.cmi>p{color:#9a9f9a;font-size:15px;line-height:1.5;margin:14px 0 4px}
.tc{border:1px solid #2c2f2c;border-radius:22px;padding:18px;margin-top:16px;background:#151815}
.tr2{display:flex;justify-content:space-between;font:700 13px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;color:#9be37a;margin-bottom:12px}
.tc label{display:block;font:700 12px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;color:#8e938e;text-transform:uppercase;margin-top:6px}
.tc input{display:block;width:100%;margin:8px 0 14px;padding:16px 18px;font:600 17px system-ui,sans-serif;color:#fff;background:#0f110f;border:1px solid #333;border-radius:16px;outline:0}
.tc input[data-f=g]{text-transform:uppercase}
.tc input:focus{border-color:#1DB954;box-shadow:0 0 0 3px #1db95433}
body.cmo{overflow:hidden}
/* now playing aesthetic */
#np{background:radial-gradient(120% 150% at 0% 0%,color-mix(in srgb,var(--g1,#1db954) 30%,transparent),transparent 62%),var(--card);transition:background .6s}
.cover{position:relative;flex:none;width:112px;height:112px;margin-right:30px}
.cover .art{width:112px;height:112px;border-radius:14px;overflow:hidden;position:relative;z-index:2;display:block;box-shadow:0 12px 30px -6px var(--g1,#1db954),0 0 0 1px #ffffff1a;transition:box-shadow .6s}
.cover .art svg{width:100%;height:100%;display:block}
.disc{position:absolute;top:6px;left:38px;width:100px;height:100px;border-radius:50%;z-index:1;background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#1d1d1d 3px 4px);box-shadow:0 0 0 2px #000}
.disc::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--g1,#1db954);box-shadow:0 0 0 3px #0c0c0c;transition:background .6s}
.playing .disc{animation:sp 4s linear infinite}
.np h2{font-size:22px;line-height:1.2}
@media (max-width:420px){.cover{width:88px;height:88px;margin-right:24px}.cover .art{width:88px;height:88px}.disc{width:78px;height:78px;left:30px;top:5px}.np{gap:12px}.np h2{font-size:18px}}
/* volume equalizer */
.eq{position:relative;flex:1;height:44px}
.bars{display:flex;align-items:flex-end;gap:3px;height:100%}
.bars i{flex:1;border-radius:3px;background:#2a2a2a;transition:background .15s,box-shadow .15s,transform .15s}
.bars i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.bars i.pk{transform:scaleY(1.14)}
.bars.mt i{background:#3a1c1c}
.eq input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;touch-action:none}
.vl{display:flex;flex-direction:column;align-items:flex-end;min-width:68px;line-height:1.35;font-weight:700}
.vl small{font-size:9px;letter-spacing:.14em;color:var(--mu)}
.playing .sp:not(.m){animation:pu 1.1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.15);text-shadow:0 0 10px #1db954}}
/* human verification gate */
body.gated{overflow:hidden}
.app{transition:opacity .7s ease .15s,transform .7s ease .15s}
body.gated .app{opacity:0;transform:translateY(14px) scale(.985)}
#gate{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));height:100vh;height:100dvh;transition:opacity .6s ease,visibility .6s;overflow:auto}
#gate::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1db95418,transparent 60%);pointer-events:none}
#gate.out{opacity:0;visibility:hidden;pointer-events:none}
.gc{position:relative;width:100%;max-width:400px;margin:auto;text-align:center;padding:36px 24px 28px;border-radius:26px;background:#050505;border:1.5px solid #1DB954;box-shadow:0 0 0 1px #1db95422,0 0 28px #1db95466,0 0 80px #1db95422,inset 0 0 30px #1db95414;animation:gp 3.2s ease-in-out infinite;transition:transform .6s ease}
#gate.out .gc{transform:scale(1.04)}
@keyframes gp{50%{box-shadow:0 0 0 1px #1db95433,0 0 40px #1db95488,0 0 100px #1db95433,inset 0 0 36px #1db95422}}
.sh{width:76px;height:76px;margin:0 auto 22px;filter:drop-shadow(0 0 12px #1db954aa)}
.ey{font-size:11px;letter-spacing:.28em;color:#1DB954;font-weight:700}
.gc h1{margin:10px 0 10px;font-size:clamp(24px,7vw,30px);letter-spacing:.04em}
.gc p{margin:0 0 28px;color:#8a8a8a;font-size:13px;line-height:1.6}
#gbtn{width:100%;font:inherit;font-weight:800;font-size:clamp(13px,3.8vw,15px);letter-spacing:.1em;color:#000;background:#1DB954;border:0;border-radius:14px;padding:20px 12px;min-height:60px;cursor:pointer;box-shadow:0 0 22px #1db95488;transition:transform .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
#gbtn:hover{box-shadow:0 0 34px #1db954cc;transform:translateY(-1px)}
#gbtn:active{transform:scale(.97)}
#gbtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.gc{animation:none}#gate,.app,.gc{transition-duration:.01s;transition-delay:0s}}
</style></head><body class="gated">
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gh">
<div class="gc">
<svg class="sh" viewBox="0 0 64 64" fill="none" stroke="#1DB954" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 5 10 13v17c0 14 9 24 22 29 13-5 22-15 22-29V13z" fill="#1db95414"/><path d="m22 32 7 7 13-14"/></svg>

</div></div>

<div class="row" style="margin-top:22px"><span class="lbl" id="pl"></span><button class="b green" id="cust">✎ Customize songs</button></div>

<div id="list"></div>
</div>

<script>
const DEF=[

let S;const $=id=>document.getElementById(id);
const GL=['#ff8a4c','#c0243c','#ff6fa3','#8ee04a','#ff5e3a'];
const SC=[
`<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='b' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1b2a5e'/><stop offset='.6' stop-color='#e5645a'/><stop offset='1' stop-color='#ffb35c'/></linearGradient></defs><rect width='100' height='100' fill='url(#b)'/><circle cx='68' cy='52' r='11' fill='#ffd9a0'/><g fill='#0d1230'><rect x='8' y='48' width='9' height='30'/><rect x='18' y='38' width='7' height='40'/><rect x='26' y='30' width='8' height='48'/><path d='M35 78V20l4-10 4 10v58z'/><rect x='44' y='44' width='10' height='34'/><rect x='55' y='54' width='8' height='24'/><rect x='64' y='60' width='9' height='18'/><rect x='74' y='50' width='7' height='28'/><rect x='82' y='58' width='10' height='20'/></g><rect y='78' width='100' height='22' fill='#10224f'/><path d='M60 84h20M52 89h30M66 94h14' stroke='#ffb35c' stroke-width='1' opacity='.6'/><path d='M24 86v-9l7 9zM23 86h10l-2 3h-6z' fill='#f5ede0'/></svg>`,
`<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='d' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#12031c'/><stop offset='1' stop-color='#6b1030'/></linearGradient></defs><rect width='100' height='100' fill='url(#d)'/><circle cx='50' cy='42' r='21' fill='#f3e7d3'/><circle cx='43' cy='36' r='4' fill='#dccdb4'/><circle cx='58' cy='48' r='5' fill='#dccdb4'/><g fill='#07010c'><path d='M0 100V74h8V64l4-6 4 6v10h8v-10l4-6 4 6v10h10v-8h6v8h10V60l4-8 4 8v14h8v-8h8v34z'/><path d='M0 100h100V88H0z'/><path d='M14 24q4-6 8 0q4-6 8 0q-4 1-8 5q-4-4-8-5z'/><path d='M72 14q3-5 6 0q3-5 6 0q-3 1-6 4q-3-3-6-4z'/><path d='M80 34q2-4 5 0q2-4 5 0q-2 1-5 3q-3-2-5-3z'/></g><g fill='#fff' opacity='.8'><circle cx='10' cy='10' r='.8'/><circle cx='90' cy='8' r='.8'/><circle cx='30' cy='8' r='.6'/></g><rect x='62' y='64' width='3' height='4' fill='#f5c542'/></svg>`,

`<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='z' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#04120f'/><stop offset='1' stop-color='#14513a'/></linearGradient></defs><rect width='100' height='100' fill='url(#z)'/><circle cx='70' cy='28' r='15' fill='#eaffc2'/><path d='M18 78V50M18 60l-8-10M18 54l8-12M18 66l9-6' stroke='#020a08' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M0 80q30-8 50-2t50-4v26H0z' fill='#020a08'/><g fill='#0a1a15'><rect x='62' y='66' width='12' height='16' rx='6'/><rect x='80' y='70' width='10' height='14' rx='5'/></g><g fill='#9ccf72'><rect x='34' y='58' width='14' height='26' rx='6'/><rect x='34' y='48' width='3.5' height='14' rx='1.7'/><rect x='38.5' y='45' width='3.5' height='16' rx='1.7'/><rect x='43' y='47' width='3.5' height='15' rx='1.7'/><rect x='47.5' y='52' width='3' height='11' rx='1.5'/></g><path d='M0 86q30-6 50 0t50-2v16H0z' fill='#010504'/></svg>`,
`<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='t' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#3a1a5e'/><stop offset='.55' stop-color='#ff5e3a'/><stop offset='1' stop-color='#ffcf6b'/></linearGradient></defs><rect width='100' height='100' fill='url(#t)'/><circle cx='50' cy='66' r='24' fill='#ffe9a8'/><polygon points='50,13 52.12,19.09 58.56,19.22 53.42,23.11 55.29,29.28 50,25.6 44.71,29.28 46.58,23.11 41.44,19.22 47.88,19.09' fill='#fff7c2'/><path d='M0 74q25-10 50 0t50-4v34H0z' fill='#8a2b1d'/><path d='M0 86q30-10 60 0t40-3v17H0z' fill='#4a1410'/><g fill='#1f0a08'><rect x='22' y='58' width='5' height='30' rx='2.5'/><rect x='14' y='66' width='4' height='12' rx='2'/><rect x='14' y='74' width='10' height='4'/><rect x='27' y='62' width='4' height='10' rx='2'/><rect x='24' y='70' width='7' height='4'/></g></svg>`];
function init(){S={tr:DEF.map(x=>({...x,liked:false})),cur:0,play:false,t:0,vol:70,prev:70}}
init();
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const vipIdx=()=>S.tr.length-1;
const likes=()=>S.tr.filter(x=>x.liked).length;
const locked=()=>likes()<2;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('s'),2200)}
function render(){
 const c=S.tr[S.cur];
 $('ttl').textContent=c.t;$('art2').textContent=c.a;$('gen').textContent=c.g.toUpperCase();
 if($('art').dataset.k!==''+S.cur){$('art').innerHTML=SC[S.cur];$('art').dataset.k=S.cur}$('np').style.setProperty('--g1',GL[S.cur]);
 $('app').classList.toggle('playing',S.play);
 $('play').textContent=S.play?'❚❚':'▶';
 $('dur').textContent=fmt(c.d);$('cur').textContent=fmt(S.t);$('fill').style.width=(S.t/c.d*100)+'%';
 $('likes').textContent='♥ Liked Songs: '+likes();
 $('pl').textContent='PLAYLIST  '+S.tr.length+' TRACKS • 1 VIP';
 const m=S.vol===0;$('spk').textContent=m?'🔇':'🔊';$('spk').classList.toggle('m',m);
 $('vol').value=S.vol;$('vp').textContent=S.vol+'%';
 const N=24,lit=Math.round(S.vol/100*N),bx=$('bars');
 if(!bx.children.length){for(let i=0;i<N;i++){const b=document.createElement('i'),p=i/N;b.style.height=(25+75*p)+'%';b.style.setProperty('--c',p<.6?'#1DB954':p<.85?'#f5b301':'#ff4d4d');bx.appendChild(b)}}
 [...bx.children].forEach((b,i)=>{b.classList.toggle('on',i<lit);b.classList.toggle('pk',i===lit-1)});
 bx.classList.toggle('mt',S.vol===0);
 $('vm').textContent=S.vol===0?'MUTED':S.vol<25?'WHISPER':S.vol<55?'CHILL':S.vol<80?'GROOVY':S.vol<95?'LOUD':'MAX BLAST';
 $('vm').style.color=S.vol===0?'#ff4d4d':'#8a8a8a';
 $('list').innerHTML=S.tr.map((x,i)=>{
  const lk=i===vipIdx()&&locked();
  return `<div class="trk${i===S.cur?' on':''}${lk?' lock':''}" data-i="${i}" id="r${i}"><span class="n">${i+1}</span><div class="i"><div class="t">${x.t}</div><div class="a">${x.a}</div></div><span class="d">${fmt(x.d)}</span><button class="hb${x.liked?' l':''}" data-h="${i}">${lk?'🔒':'♥'}</button></div>`}).join('');
}
function select(i){
 if(i===vipIdx()&&locked()){const r=$('r'+i);r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');toast('🔒 Like at least 2 songs to unlock the VIP track');return}
 S.cur=i;S.t=0;S.play=true;render();
}
$('list').addEventListener('click',e=>{
 const h=e.target.closest('[data-h]');
 if(h){e.stopPropagation();const i=+h.dataset.h;
  if(i===vipIdx()&&locked()){select(i);return}
  S.tr[i].liked=!S.tr[i].liked;
  if(locked()&&S.cur===vipIdx()){S.play=false;S.cur=0;S.t=0;toast('VIP track locked again. Back to track 1')}
  render();return}
 const r=e.target.closest('.trk');if(r)select(+r.dataset.i);
});
function step(d){let i=S.cur;do{i=(i+d+S.tr.length)%S.tr.length}while(i===vipIdx()&&locked());S.cur=i;S.t=0;render()}
$('next').onclick=()=>step(1);$('prev').onclick=()=>step(-1);
$('play').onclick=()=>{S.play=!S.play;render()};
$('bar').onclick=e=>{const r=$('bar').getBoundingClientRect();S.t=Math.floor((e.clientX-r.left)/r.width*S.tr[S.cur].d);render()};
$('vol').oninput=e=>{const v=+e.target.value;if(v>0)S.prev=v;S.vol=v;render()};
$('spk').onclick=()=>{if(S.vol>0){S.prev=S.vol;S.vol=0}else S.vol=S.prev||70;render()};
$('reset').onclick=()=>{init();render()};
const cm=$('cm');
function openCm(){
 $('cmb').innerHTML=S.tr.map((x,i)=>`<div class="tc"><div class="tr2"><span>TRACK ${String(i+1).padStart(2,'0')}</span><span>${i===vipIdx()?'VIP TRACK':'PLAYLIST TRACK'}</span></div>`+[['t','Title','text',x.t],['a','Artist','text',x.a],['g','Genre','text',x.g],['d','Duration (seconds)','number',x.d]].map(f=>`<label>${f[1]}</label><input data-i="${i}" data-f="${f[0]}" type="${f[2]}" ${f[2]==='number'?'min="10" max="600" inputmode="numeric"':''} value="${String(f[3]).replace(/"/g,'&quot;')}">`).join('')+'</div>').join('');
 cm.classList.add('o');document.body.classList.add('cmo');cm.scrollTop=0;
}
function closeCm(){cm.classList.remove('o');document.body.classList.remove('cmo')}
$('cust').onclick=openCm;$('cmx').onclick=closeCm;
cm.addEventListener('click',e=>{if(e.target===cm)closeCm()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCm()});
$('cmb').addEventListener('input',e=>{const t=e.target,i=+t.dataset.i,f=t.dataset.f;if(isNaN(i))return;
 if(f==='d'){const v=parseInt(t.value,10);if(!(v>=10))return;S.tr[i].d=Math.min(v,600);if(i===S.cur&&S.t>=S.tr[i].d)S.t=0}else S.tr[i][f]=t.value;
 render()});
setInterval(()=>{if(!S.play)return;const d=S.tr[S.cur].d;S.t++;if(S.t>=d){step(1)}else{$('cur').textContent=fmt(S.t);$('fill').style.width=(S.t/d*100)+'%'}},1000);
// visualizer
const cv=$('cv'),cx=cv.getContext('2d');let ph=0;
let vm='wave';
function other(w,h,amp,my){
 cx.shadowColor='#1DB954';cx.shadowBlur=12;cx.fillStyle='#6fd45a';cx.strokeStyle='#6fd45a';
 if(vm==='pulse'){
  if(amp<=0)return;
  cx.lineWidth=4;cx.beginPath();
  for(let x=0;x<=w;x+=3){
   const u=(x/w)*3-ph*.35,k=u-Math.floor(u);let d=0;
   if(k>.1&&k<.16)d=-.15*Math.sin((k-.1)/.06*Math.PI);
   else if(k>.3&&k<.34)d=.25*Math.sin((k-.3)/.04*Math.PI);
   else if(k>.34&&k<.42)d=-Math.sin((k-.34)/.08*Math.PI);
   else if(k>.42&&k<.48)d=.35*Math.sin((k-.42)/.06*Math.PI);
   else if(k>.6&&k<.75)d=-.3*Math.sin((k-.6)/.15*Math.PI);
   const y=my+d*amp*h*.38;x?cx.lineTo(x,y):cx.moveTo(x,y);
  }
  cx.stroke();
 } else if(vm==='bars'||vm==='mirror'){
  const n=vm==='bars'?28:44,bw=w/n;
  for(let i=0;i<n;i++){
   const v=amp>0?(Math.sin(ph*1.5+i*.45)*.5+.5)*(Math.sin(ph*2.3+i*.8)*.3+.7)*amp:0;
   cx.beginPath();
   if(vm==='bars'){const bh=Math.max(6,v*(h-16));cx.roundRect(i*bw+4,h-bh-6,bw-8,bh,6)}
   else{const bh=Math.max(3,v*h*.44);cx.roundRect(i*bw+3,my-bh,bw-6,bh*2,4)}
   cx.fill();
  }
 } else if(vm==='dots'){
  const n=26,rows=5,bw=w/n;
  for(let i=0;i<n;i++){
   const v=amp>0?(Math.sin(ph*1.5+i*.5)*.5+.5)*(Math.sin(ph*2.1+i*.9)*.3+.7)*amp:0,lit=Math.round(v*rows);
   for(let j=0;j<rows;j++){cx.globalAlpha=j<lit?1:.18;cx.beginPath();cx.arc(i*bw+bw/2,h-14-j*(h-28)/(rows-1),6,0,7);cx.fill()}
  }
  cx.globalAlpha=1;
 }
}
$('modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;vm=b.dataset.m;[...$('modes').children].forEach(x=>x.classList.toggle('on',x===b))};
function draw(){
 const w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2;cx.clearRect(0,0,w,h);
 const amp=S.play?S.vol/100:0,my=h/2;ph+=.05;
 cx.lineCap='round';cx.lineJoin='round';
 cx.setLineDash([16,12]);cx.lineWidth=3;cx.strokeStyle='#6fbf5a';cx.globalAlpha=S.vol===0?.5:.9;
 if(['wave','pulse','mirror'].includes(vm)){cx.beginPath();cx.moveTo(0,my);cx.lineTo(w,my);cx.stroke()}cx.setLineDash([]);cx.globalAlpha=1;
 if(vm!=='wave'){other(w,h,amp,my);cx.shadowBlur=0}else if(amp>0){
  cx.lineWidth=4;cx.strokeStyle='#6fd45a';cx.shadowColor='#1DB954';cx.shadowBlur=14;
  cx.beginPath();
  for(let x=0;x<=w;x+=4){
   const u=x/w,env=Math.sin(Math.PI*u)*.35+.65;
   const y=my-(Math.sin(u*7+ph)*.5+Math.sin(u*13-ph*1.4)*.3+Math.sin(u*3+ph*.6)*.35)*amp*(h*.34)*env;
   x?cx.lineTo(x,y):cx.moveTo(x,y);
  }
  cx.stroke();cx.shadowBlur=0;
 }
 requestAnimationFrame(draw)}
$('gbtn').onclick=()=>{$('gate').classList.add('out');document.body.classList.remove('gated');setTimeout(()=>{$('gate').style.display='none'},700)};
$('gbtn').focus({preventScroll:true});
render();draw();
</script></body></html>
