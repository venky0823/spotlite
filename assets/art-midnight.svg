<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching screenshot -->
    <linearGradient id="bg-grad-midnight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="50%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <radialGradient id="vinyl-groove" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="60%" stop-color="#121212" />
      <stop offset="90%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded artwork canvas -->
  <rect width="200" height="200" rx="28" fill="url(#bg-grad-midnight)" />

  <!-- Outer Vinyl Disc -->
  <circle cx="100" cy="100" r="76" fill="url(#vinyl-groove)" stroke="#222222" stroke-width="2" />
  
  <!-- Subtle Vinyl Grooves -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#252525" stroke-width="1" />
  <circle cx="100" cy="100" r="60" fill="none" stroke="#1f1f1f" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="#2d2d2d" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Center Spindle & Label -->
  <circle cx="100" cy="100" r="32" fill="#2E7D32" stroke="#1DB954" stroke-width="1.5" />
  <circle cx="100" cy="100" r="16" fill="#121212" />
  <circle cx="100" cy="100" r="6" fill="#1DB954" filter="url(#glow)" />

  <!-- Radar sweep / Telemetry line -->
  <line x1="100" y1="100" x2="160" y2="70" stroke="#1DB954" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="160" cy="70" r="2.5" fill="#1DB954" filter="url(#glow)" />

  <!-- Bottom-Right 4-Dot Equalizer Indicator from Screenshot -->
  <rect x="138" y="146" width="46" height="26" rx="8" fill="#121212" opacity="0.85" stroke="#282828" stroke-width="1" />
  <circle cx="148" cy="159" r="2.5" fill="#1DB954" />
  <circle cx="156" cy="159" r="2.5" fill="#1DB954" />
  <circle cx="164" cy="159" r="2.5" fill="#1DB954" />
  <circle cx="172" cy="159" r="2.5" fill="#1DB954" />
</svg>